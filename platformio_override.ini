# Local build configuration for the "Home Gadgets" controller
# (ESP32 38-pin DevKit, 8 relays, 8 mains wall switches via AC opto modules, 2 PIR sensors,
#  2 addressable LED strips, MAX4466 analog microphone).
# This file is listed in .gitignore - it only affects your own builds.

[platformio]
default_envs = home_gadgets

[env:home_gadgets]
extends = env:esp32dev_V4             ; analog microphones (MAX4466) need the ESP-IDF V4 framework
custom_usermods = audioreactive home_gadgets
build_flags = ${env:esp32dev_V4.build_flags}
  -D SR_DMTYPE=0                      ; audioreactive: analog microphone
  -D AUDIOPIN=36                      ; MAX4466 OUT -> GPIO36 (VP), must be an ADC1 pin

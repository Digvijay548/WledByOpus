async function getJSON(u){ const r=await fetch(u,{cache:"no-store"}); if(!r.ok) throw new Error(r.status); return r.json(); }
function sendState(o){ return fetch("/json/state",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(o)}).catch(()=>toast("Device not reachable")); }
// the API key is required by the device for everything that can switch a relay
function cmd(o){
	if(cfg&&cfg.key) o.k=cfg.key;
	else if(o.relay!==undefined||o.scene!==undefined||o.alloff||o.away!==undefined){
		// the device creates its key a few seconds after Wi-Fi starts; without it these commands are ignored
		toast("The device is still starting – try again in a moment"); reloadCfg(); return Promise.resolve();
	}
	return sendState({HomeGadgets:o});
}
function markDirty(sec){ dirty.add(sec); clearTimeout(saveTimer); saveTimer=setTimeout(flushSave,700); }
async function flushSave(){ const b={}; for(const s of dirty) b[s]=cfg[s]; dirty.clear(); if(Object.keys(b).length) await postCfg(b); }
async function postCfg(body,retry){
	const pin=pinMem;
	let r;
	try{ r=await fetch("/home/cfg?k="+encodeURIComponent(cfg.key||"")+(pin?"&pin="+encodeURIComponent(pin):""),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}); }
	catch(e){ toast("Not saved: device not reachable"); return false; }
	if(r.status==403 && !retry){ // key not created yet or changed on another phone: fetch it and try once more
		try{ const n=await getJSON("/home/cfg"); cfg.key=n.key; }catch(e){}
		return postCfg(body,1);
	}
	if(r.status==429){ // right after a wrong PIN the device refuses every PIN for a few seconds
		toast("Not saved: wait a few seconds, then try again"); return false;
	}
	if(r.status==401){
		const p=await ask("Settings PIN","This device is protected by a settings PIN.","",true,"4-digit PIN");
		if(p){ pinMem=p; return postCfg(body); }
		toast("Not saved: PIN required"); return false;
	}
	if(r.status==503 && (retry||0)<10){ await sleep(300); return postCfg(body,(retry||0)+1); }
	if(!r.ok){ toast("Not saved ("+r.status+")"); return false; }
	expectRev=live?live.rev:-1;
	saveToast=true; toast("Saving…"); // "Saved ✓" follows in reloadCfg() once the device applied it
	return true;
}
async function reloadCfg(){
	try{
		const n=await getJSON("/home/cfg");
		if(dirty.size){ // keep local edits that are not saved yet, take over read-only info only
			for(const k of ["bm","lim","name","pinReq","pinSet","ce","rev","moods","key"]) cfg[k]=n[k];
			for(const k of ["relays","sw","pir"]) cfg[k].forEach((o,i)=>{ o.e=n[k][i].e; o.o=n[k][i].o; });
		} else cfg=n;
		if(cfg.ce) toast("The device rejected the last change");
		else if(saveToast) toast("Saved ✓");
		saveToast=false;
		pinBanner();
		softRender();
	}catch(e){}
}
async function poll(){
	try{
		live=await getJSON("/home/live");
		connState(1);
		const now=Date.now();
		for(const [el,fn] of liveEls) if(!(el._hold>now)) fn(el,live);
		drawLeds();
		if(expectRev!==null && live.rev!==expectRev){ expectRev=null; reloadCfg(); }
		else if(cfg && !cfg.key && Date.now()-keyTry>3000){ keyTry=Date.now(); reloadCfg(); } // key not created yet
	}catch(e){ connState(0); }
}
// connection dot: colour plus a text for the tooltip and screen readers
function connState(ok){ const c=$("#conn"), t=ok?"Connected":"Can’t reach the device"; c.className="dot "+(ok?"ok":"bad"); c.title=t; c.setAttribute("aria-label",t); }

// effect names, palette names and effect metadata: fetched one after another (the device has one shared JSON buffer), then cached
let fxc=null;
async function loadFx(){
	if(fxc) return fxc;
	const eff=await getJSON("/json/eff"), pal=await getJSON("/json/pal"), fxd=await getJSON("/json/fxdata");
	return fxc={eff,pal,fxd};
}
// metadata "sliders;colours;palette;flags;defaults", read the same way as setEffectParameters() in wled00/data/index.js
function fxMeta(i){
	const s=fxc.fxd[i]||"", p=s?s.split(";"):[], sp=x=>(p[x]?p[x].split(","):[]), fl=i?(p[3]||"1"):"";
	return {def:s.length>0,sl:sp(0),co:sp(1),pa:sp(2),snd:/[vf]/.test(fl),only2D:fl.includes("2")&&!fl.includes("1")};

// live strip preview: ~20 fps binary frames from /home/ws while that stream runs, otherwise /home/live "px" every second
// (16 evenly spaced LED colours per strip, sampled on the device; WLED's /json/live only exists in builds without
// websockets); also tints the header
let livePv=[], ws=null, wsF=null, wsT=0, wsO=0, wsTry=0, wsTmr=0, wsRaf=0, wsTint=0;
function livePreview(k,cls){
	const c=h("canvas",{class:cls||"lv",height:cls?6:14,"aria-hidden":"true"}); livePv.push([c,k]);
	setTimeout(wsCheck,0); if(wsF&&!wsRaf) wsRaf=requestAnimationFrame(wsDraw); // don't wait for the next frame
	return c;
}
// S[k]: colours of strip k as [r,g,b] screen values; each canvas gets a smooth gradient with one stop per sample
function paintPv(S,tint){
	livePv=livePv.filter(([c])=>c.isConnected);
	for(const [c,k] of livePv){
		const L=S[k], w=c.clientWidth; if(!L||!L.length||!w) continue;
		const x=c.getContext("2d"), n=L.length-1;
		if(c.width!==w) c.width=w;
		const g=x.createLinearGradient(0,0,w,0);
		L.forEach((p,i)=>g.addColorStop(n?i/n:0,"rgb("+p+")"));
		x.fillStyle=g; x.fillRect(0,0,w,c.height);
	}
	if(tint) [0,1].forEach(k=>{ const L=S[k]; if(L&&L.length) $("header").style.setProperty("--g"+(k+1),"rgb("+[0,1,2].map(j=>L.reduce((a,p)=>a+p[j],0)/L.length|0)+")"); });
}
function drawLeds(){
	wsCheck();
	const px=live&&live.px; if(!Array.isArray(px)||d.hidden||Date.now()-wsT<3000) return; // the stream draws
	const hexOk=v=>typeof v==="string"&&/^[0-9a-fA-F]{6}$/.test(v)?v:"000000";
	// px already has the brightness applied by the device
	paintPv(px.map(L=>Array.isArray(L)?L.map(v=>{ const n=parseInt(hexOk(v),16); return [n>>16,n>>8&255,n&255]; }):null),1);
}
// /home/ws is open only while the page is visible and a preview canvas is on screen; reconnects with backoff
function wsCheck(){
	livePv=livePv.filter(([c])=>c.isConnected);
	if(d.hidden||!cfg||!cfg.key||!livePv.some(([c])=>c.getClientRects().length)){
		clearTimeout(wsTmr); wsTmr=0;
		if(ws){ ws.onclose=null; ws.close(); ws=wsF=null; wsT=0; }
		return;
	}
	if(ws||wsTmr) return;
	wsO=Date.now();
	ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host+"/home/ws?k="+encodeURIComponent(cfg.key)); // wss behind an HTTPS proxy
	ws.binaryType="arraybuffer";
	ws.onmessage=e=>{
		// 'H', version 1, bri, n0, n1, then n0+n1 samples R,G,B (not scaled by bri); anything else is ignored
		const b=new Uint8Array(e.data), n0=b[3], n1=b[4];
		if(b[0]!==72||b[1]!==1||n0>48||n1>48||b.length!==5+3*(n0+n1)) return;
		// LED gamma and linear PWM brightness on an sRGB screen: shown = c*(bri/255)^(1/2.2)
		const f=(b[2]/255)**(1/2.2), S=[[],[]];
		for(let i=5;i<b.length;i+=3) S[i<5+3*n0?0:1].push([b[i]*f+.5|0,b[i+1]*f+.5|0,b[i+2]*f+.5|0]);
		wsF=S; wsT=Date.now();
		if(!wsRaf) wsRaf=requestAnimationFrame(wsDraw);
	};
	ws.onclose=()=>{ // also after an error or a refused upgrade
		ws=wsF=null; wsT=0;
		if(Date.now()-wsO>20000) wsTry=0; // it ran for a while: start the backoff again
		wsTmr=setTimeout(()=>{ wsTmr=0; wsCheck(); },[1,2,5,10][Math.min(wsTry++,3)]*1000);
	};
}
// at most one draw per animation frame; the header tint follows at most 4 times a second
function wsDraw(){ wsRaf=0; if(!wsF) return; const t=Date.now(), tint=t-wsTint>250; if(tint) wsTint=t; paintPv(wsF,tint); }
d.addEventListener("visibilitychange",wsCheck);

/* ---------- dialogs ---------- */
function modal(build){
	return new Promise(res=>{
		// Escape closes only the top-most dialog (the mood editor can open a name dialog on top)
		const esc=e=>{ if(e.key=="Escape"&&m===[...d.querySelectorAll(".modal")].pop()) close(null); };
		const close=v=>{ d.removeEventListener("keydown",esc); m.remove(); res(v); };
		const box=h("div",{class:"box",role:"dialog","aria-modal":"true"});
		const m=h("div",{class:"modal",onclick:e=>{ if(e.target===m) close(null); }},box);
		build(box,close); d.body.append(m); d.addEventListener("keydown",esc);
		const t=box.querySelector("h3"); if(t) box.setAttribute("aria-label",t.textContent); // dialog name = its title
		const f=box.querySelector("input"); if(f) f.focus();
	});
}
function ask(title,text,value,secret,ph){
	return modal((box,close)=>{
		const inp=h("input",{type:secret?"password":"text",value:value||"",maxLength:23,placeholder:ph,"aria-label":title,onkeydown:e=>{ if(e.key=="Enter") close(inp.value.trim()||null); }});

			h("div",{class:"row"},h("button",{class:"grow",text:"Cancel",onclick:()=>close(null)}),h("button",{class:"pri grow",text:"OK",onclick:()=>close(inp.value.trim()||null)}))));
	});
}
function confirmBox(title,text,okLabel){

		box.append(h("h3",{text:title}),h("div",{class:"muted small",text}),
			h("div",{class:"row"},h("button",{class:"grow",text:"Cancel",onclick:()=>close(false)}),h("button",{class:"pri grow",text:okLabel||"OK",onclick:()=>close(true)})));

function sheet(title,items){
	return modal((box,close)=>{

// pick up to `count` distinct, well-lit colours from a photo (drawn small on a canvas, never uploaded)
function photoColors(img,count){
	const c=h("canvas",{width:56,height:56}), x=c.getContext("2d"); x.drawImage(img,0,0,56,56);
	const px=x.getImageData(0,0,56,56).data, b=new Map();
	for(let i=0;i<px.length;i+=4){
		const r=px[i],g=px[i+1],bl=px[i+2],mx=Math.max(r,g,bl),mn=Math.min(r,g,bl); if(mx<30) continue;
		const key=(r>>5)<<6|(g>>5)<<3|(bl>>5), e=b.get(key)||{k:0,w:0,r:0,g:0,b:0};
		e.k++; e.w+=1+3*(mx-mn)/mx; e.r+=r; e.g+=g; e.b+=bl; b.set(key,e); // saturated colours weigh more
	}
	const pick=[];
	for(const e of [...b.values()].sort((p,q)=>q.w-p.w)){
		const col=[e.r/e.k,e.g/e.k,e.b/e.k];
		if(pick.every(p=>Math.hypot(p[0]-col[0],p[1]-col[1],p[2]-col[2])>70)) pick.push(col);
		if(pick.length===count) break;
	}
	while(pick.length<count) pick.push([255,214,160]);
	// LEDs wash out muddy colours, so push saturation up a little
	return pick.map(p=>{ const mx=Math.max(...p); return p.map(v=>Math.max(0,Math.min(255,Math.round(mx-(mx-v)*1.25)))); });
}
